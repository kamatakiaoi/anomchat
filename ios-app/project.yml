name: AnonymousChat
options:
  bundleIdPrefix: com.anonymous.chat
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.anonymous.chat.ios
    MARKETING_VERSION: "3.6.6"
    CURRENT_PROJECT_VERSION: "366"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
    INFOPLIST_FILE: AnonymousChat/Info.plist

targets:
  AnonymousChat:
    type: application
    platform: iOS
    sources:
      - path: AnonymousChat
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: AnonymousChat/Info.plist
        PRODUCT_NAME: "AnonymousChat"
        GENERATE_INFOPLIST_FILE: "NO"
