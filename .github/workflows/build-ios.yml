name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build and Archive iOS App
        working-directory: ios-app
        run: |
          xcodebuild clean archive \
            -project AnonymousChat.xcodeproj \
            -scheme AnonymousChat \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AnonymousChat.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned / Sideloadable IPA
        working-directory: ios-app
        run: |
          mkdir -p build/Payload
          cp -r build/AnonymousChat.xcarchive/Products/Applications/AnonymousChat.app build/Payload/
          cd build
          zip -r ../AnonymousChat.ipa Payload/
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnonymousChat-v3.6.6-iOS.ipa
          path: ios-app/AnonymousChat.ipa
          retention-days: 30
