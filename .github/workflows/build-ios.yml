name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Compatible Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build iOS App (Release)
        working-directory: ios-app
        run: |
          xcodebuild clean build \
            -project AnonymousChat.xcodeproj \
            -scheme AnonymousChat \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build"

      - name: Package Sideloadable IPA
        working-directory: ios-app
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/AnonymousChat.app build/Payload/
          cd build
          zip -r ../AnonymousChat.ipa Payload/
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnonymousChat-v3.6.6-iOS.ipa
          path: ios-app/AnonymousChat.ipa
          retention-days: 30
